name: Core Candidate Gate

# Hosted macOS is an explicit release/governance gate, not a development loop.
# Run this workflow manually on the exact Candidate/pre-merge ref that needs
# acceptance. Ordinary PR pushes and main pushes do not consume hosted macOS.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the hosted macOS gate is required"
        required: true
        type: choice
        options:
          - candidate
          - pre-merge
          - exceptional

# A newer explicit validation for the same ref supersedes an older one.
concurrency:
  group: videotext-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-candidate:
    name: Core Candidate / Pre-merge
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact source identity
        run: git rev-parse HEAD
      - name: Quality Gate — owned TMP lifecycle
        run: scripts/test_owned_tmp.sh
      - name: Validate development baseline
        run: scripts/test_baseline_guard.sh
      - name: Validate Whisper VAD and long-form recovery
        run: scripts/test_whisper_vad.sh
      - name: Validate transcription quality
        run: scripts/test_transcription_quality.sh
      - name: Validate project schema
        run: scripts/test_project_schema.sh
      - name: Validate human review
        run: scripts/test_human_review.sh
      - name: Validate topic analysis
        run: scripts/test_topics.sh
      - name: Validate topic review matrix
        run: scripts/test_topic_matrix.sh
      - name: Validate result discovery and access contract
        run: scripts/test_result_access.sh
      - name: Validate application/process lifecycle
        run: |
          scripts/test_process_shutdown.sh
          scripts/test_application_lifecycle.sh
      - name: Build exact core source
        env:
          VIDEOTEXT_APP_PATH: ${{ runner.temp }}/videotext-core.app
        run: scripts/build_app.sh
      - name: Verify core bundle
        env:
          VIDEOTEXT_APP_PATH: ${{ runner.temp }}/videotext-core.app
        run: |
          codesign --verify --deep --strict "$VIDEOTEXT_APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$VIDEOTEXT_APP_PATH/Contents/Info.plist")" = "local.codex.videotext.v3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$VIDEOTEXT_APP_PATH/Contents/Info.plist")" = "0.6.8"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$VIDEOTEXT_APP_PATH/Contents/Info.plist")" = "2026.09.25.1"
