name: Paid macOS Infrastructure Gate

# Cost boundary: never add push, pull_request, schedule, or workflow_call here.
# Governed dispatch starts with scripts/dispatch_paid_macos_gate.py.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Exact classified base commit SHA"
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character LEVEL_B commit SHA"
        required: true
        type: string
      classification_sha256:
        description: "SHA-256 of deterministic local classification JSON"
        required: true
        type: string
      local_gate_evidence:
        description: "Machine-readable exact-SHA evidence for all applicable local gates"
        required: true
        type: string
      attempt:
        description: "Initial validation or the single controlled infrastructure retry"
        required: true
        type: choice
        options:
          - initial
          - infrastructure_retry
      retry_evidence:
        description: "Compact retry evidence JSON; {} for initial"
        required: true
        default: "{}"
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: videotext-paid-macos-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  clean-build-toolchain:
    if: ${{ github.run_attempt == 1 && github.sha == inputs.expected_sha }}
    name: Exact-SHA clean macOS build/toolchain validation
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}

      - name: Verify exact SHA and retry contract
        env:
          ATTEMPT: ${{ inputs.attempt }}
          BASE_SHA: ${{ inputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          LOCAL_GATE_EVIDENCE: ${{ inputs.local_gate_evidence }}
          RETRY_EVIDENCE: ${{ inputs.retry_evidence }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import sys

          sys.path.insert(0, "scripts")
          import dispatch_paid_macos_gate as guard

          expected = os.environ["EXPECTED_SHA"]
          base = os.environ["BASE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("expected_sha must be a full lowercase SHA")
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("base_sha must be a full lowercase SHA")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected:
              raise SystemExit(f"exact SHA mismatch: {actual} != {expected}")
          default_branch = os.environ["DEFAULT_BRANCH"]
          git_environment = os.environ.copy()
          git_environment["GIT_CONFIG_COUNT"] = "1"
          git_environment["GIT_CONFIG_KEY_0"] = "http.https://github.com/.extraheader"
          git_environment["GIT_CONFIG_VALUE_0"] = "AUTHORIZATION: basic " + base64.b64encode(
              f"x-access-token:{os.environ['GH_TOKEN']}".encode()
          ).decode()
          subprocess.run(
              [
                  "git",
                  "fetch",
                  "--quiet",
                  "origin",
                  f"refs/heads/{default_branch}:refs/remotes/origin/{default_branch}",
              ],
              check=True,
              env=git_environment,
          )
          canonical_base = subprocess.check_output(
              ["git", "merge-base", f"origin/{default_branch}", expected], text=True
          ).strip()
          if base != canonical_base:
              raise SystemExit(f"base_sha is not canonical merge-base: {base} != {canonical_base}")

          guard.validate_local_gate_evidence(
              json.loads(os.environ["LOCAL_GATE_EVIDENCE"]), expected
          )

          same_sha_runs = guard.workflow_runs(expected)
          prior_same_sha_runs = [
              item for item in same_sha_runs if str(item["id"]) != os.environ["GITHUB_RUN_ID"]
          ]

          attempt = os.environ["ATTEMPT"]
          evidence = json.loads(os.environ["RETRY_EVIDENCE"])
          if attempt == "initial":
              if evidence != {}:
                  raise SystemExit("initial attempt must not contain retry evidence")
              if prior_same_sha_runs:
                  raise SystemExit("initial attempt is not the first exact-SHA dispatch")
          elif attempt == "infrastructure_retry":
              if len(prior_same_sha_runs) != 1:
                  raise SystemExit("only one same-SHA infrastructure retry is permitted")
              verified_failure_class = guard.classify_prior_failure(
                  evidence.get("priorRunId", 0), expected
              )
              guard.validate_retry_evidence(
                  evidence,
                  expected,
                  prior_same_sha_runs,
                  verified_failure_class,
              )
          else:
              raise SystemExit("unknown attempt type")
          PY

      - name: Verify deterministic LEVEL_B eligibility
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CLASSIFICATION_SHA256: ${{ inputs.classification_sha256 }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 scripts/ci_risk_classifier.py \
            --base "$BASE_SHA" \
            --head "$EXPECTED_SHA" \
            --output "$RUNNER_TEMP/ci-risk.json" \
            > "$RUNNER_TEMP/ci-risk.stdout.json"
          python3 - "$RUNNER_TEMP/ci-risk.json" "$CLASSIFICATION_SHA256" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected_digest = sys.argv[2]
          actual_digest = hashlib.sha256(path.read_bytes()).hexdigest()
          result = json.loads(path.read_text(encoding="utf-8"))
          if actual_digest != expected_digest:
              raise SystemExit("classification evidence digest mismatch")
          if result["level"] != "LEVEL_B" or not result["decision"]["hostedMacosEligible"]:
              raise SystemExit("paid macOS is not eligible for this diff")
          PY

      - name: Record clean toolchain identity
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version

      - name: Prepare isolated registered SeminarText fixture
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/videotext-registry-fixture
          PREPARED_SEMINARTEXT: ${{ runner.temp }}/videotext-registry-seminartext
        run: |
          python3 scripts/create_registry_test_fixture.py \
            --root "$FIXTURE_ROOT" \
            --material-root "$GITHUB_WORKSPACE/Resources/SeminarText" \
            --prepared-output "$PREPARED_SEMINARTEXT" \
            --github-env "$GITHUB_ENV"

      - name: Build exact source snapshot
        env:
          VIDEOTEXT_APP_PATH: ${{ runner.temp }}/videotext-infrastructure-gate.app
        run: scripts/build_app.sh

      - name: Verify bundle, signature, and native architecture
        env:
          VIDEOTEXT_APP_PATH: ${{ runner.temp }}/videotext-infrastructure-gate.app
        run: |
          codesign --verify --deep --strict "$VIDEOTEXT_APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$VIDEOTEXT_APP_PATH/Contents/Info.plist")" = "local.codex.videotext.v3"
          file "$VIDEOTEXT_APP_PATH/Contents/MacOS/videotext" | grep -Eq 'Mach-O.*(arm64|x86_64|universal)'
