name: Topic Regression

# macOS runners are intentionally NOT triggered on every PR push.
# Development regression runs locally; this hosted macOS gate is reserved for
# explicit Candidate/pre-merge validation and canonical main verification.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the hosted macOS gate is required (candidate/pre-merge)"
        required: true
        type: choice
        options:
          - candidate
          - pre-merge
          - exceptional
  push:
    branches: [main]

# Manual validation for the same ref supersedes an older in-progress run.
# Canonical main validations remain non-cancellable.
concurrency:
  group: videotext-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  topic-regression:
    name: Quality Gate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Quality Gate — owned TMP lifecycle
        run: scripts/test_owned_tmp.sh
      - name: Validate development baseline
        run: scripts/test_baseline_guard.sh
      - name: Validate Whisper VAD and long-form recovery
        run: scripts/test_whisper_vad.sh
      - name: Validate transcription quality
        run: scripts/test_transcription_quality.sh
      - name: Validate project schema
        run: scripts/test_project_schema.sh
      - name: Validate human review
        run: scripts/test_human_review.sh
      - name: Validate topic analysis
        run: scripts/test_topics.sh
      - name: Validate topic review matrix
        run: scripts/test_topic_matrix.sh
